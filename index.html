<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="formulario">
      <fieldset class="contenedor">
        <legend>Formulario</legend>
        <div class="caja">
          <h1>¿Quien es Usted?</h1>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" />
          <br />
          <label for="gmail"> Email:</label>
          <input type="email" id="gmail" name="gmail" />
          <br />
          <label for="Sección">Elija su sección:</label>
          <select id="sección" name="sección">
            <option value="Ciencias">Ciencias</option>
            <option value="Compu">Compu</option>
            <option value="DiseñoA">Diseño A</option>
            <option value="DiseñoB">Diseño B</option>
          </select>
          <br /><br />
          <textarea id="comentario" name="mensaje" rows="10" cols="30">
Escribe tu comentario aquí</textarea
          >
          <br />
          <button
            type="button"
            onclick="alert('Tu información ha sido enviada')"
          >
            Enviar
          </button>
        </div>
      </fieldset>
    </form>
  </body>
</html>
